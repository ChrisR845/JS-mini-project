<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projects - Intro to JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="mb-4">Mini Projects - Intro to JS</h1>

        <!-- Tip Calculator -->
        <div class="card mb-4">
            <div class="card-header">
                Tip Calculator
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="subtotal" class="form-label">Subtotal</label>
                    <input type="number" class="form-control" id="subtotal" placeholder="67.72">
                </div>
                <div class="mb-3">
                    <label for="tipPercent" class="form-label">Tip %</label>
                    <input type="number" class="form-control" id="tipPercent" placeholder="0.2">
                </div>
                <div class="result-box">
                    <p>Tip Amount: <span id="tipAmount"></span></p>
                    <p>Total Bill: <span id="totalAmount"></span></p>
                </div>
                <button class="btn btn-primary mt-3" id="tipBtn">Calculate Tip</button>
            </div>
        </div>

        <!-- Paycheck Calculator -->
        <div class="card mb-4">
            <div class="card-header">
                Paycheck Calculator
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="hourlyRate" class="form-label">Hourly Worked</label>
                    <input type="number" class="form-control" id="hourlyRate" placeholder="40">
                </div>
                <div class="mb-3">
                    <label for="taxRate" class="form-label">Hourly Rate %</label>
                    <input type="number" class="form-control" id="taxRate" placeholder="15.92">
                </div>
                <div class="result-box">
                    <p>Paycheck Amount: <span id="grossPay">$0.00</span></p>
                </div>
                <button class="btn btn-primary mt-3" id="paycheckBtn">Calculate Paycheck</button>
            </div>
        </div>

        <!-- Grade Calculator -->
        <div class="card mb-4">
            <div class="card-header">
                Grade Calculator
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="testScore" class="form-label">Points Earned</label>
                    <input type="number" class="form-control" id="testScore" placeholder="50">
                </div>
                <div class="mb-3">
                    <label for="finalExamScore" class="form-label">Total Points</label>
                    <input type="number" class="form-control" id="finalExamScore" placeholder="100">
                </div>
                <div class="result-box">
                    <p>Your Grade: <span id="finalGrade">0%</span></p>
                </div>
                <button class="btn btn-primary mt-3" id="gradeBtn">Calculate Grade</button>
            </div>
        </div>

        <!-- Gas Cost Calculator -->
        <div class="card mb-4">
            <div class="card-header">
                Gas Cost Calculator
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="fuelEconomy" class="form-label">Tank Size (gallons)</label>
                    <input type="number" class="form-control" id="fuelEconomy" placeholder="15.3">
                </div>
                <div class="mb-3">
                    <label for="gasPrice" class="form-label">Price Per Gallon ($)</label>
                    <input type="number" class="form-control" id="gasPrice" placeholder="4.20">
                </div>
                <div class="result-box">
                    <p>Cost to Fill up: <span id="fuelNeeded">0.00</span></p>
                </div>
                <button class="btn btn-primary mt-3" id="gasBtn">Calculate Gas Cost</button>
            </div>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
